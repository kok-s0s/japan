<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width" />
    <title>日语学习</title>
    <link rel="stylesheet" href="styles/base.css" />
    <link rel="stylesheet" href="styles/index.css" />
    <script type="module" src="scripts/index.js"></script>
    <script type="module" src="scripts/countdown.js"></script>
    <!-- 引入 SweetAlert2 -->
    <link rel="stylesheet" href="styles/sweetalert2.min.css" />
    <script src="scripts/sweetalert2.all.min.js"></script>
  </head>
  <body>
    <div class="tabs">
      <button class="tab-button active" data-tab="tab1">词卡</button>
      <button class="tab-button" data-tab="tab2">书写</button>
      <button class="tab-button" data-tab="tab3">推荐链接</button>
      <button class="tab-button" data-tab="tab4">使用说明</button>
    </div>

    <div id="tab1" class="tab-content active">
      <div class="card-container">
        <!-- 原 card 和 training 区域 -->
        <div class="card">
          <button
            type="button"
            id="prevButton"
            class="nav-button left"
            aria-label="prev"
          ></button>
          <div class="card-content">
            <div class="row"><div id="kanji">板</div></div>
            <button type="button" id="speakButton" aria-label="speak">
              <svg
                t="1745561517820"
                class="icon"
                viewBox="0 0 1024 1024"
                version="1.1"
                xmlns="http://www.w3.org/2000/svg"
                p-id="12588"
                id="voiceIcon"
                width="36"
                height="36"
                viewBox="0 0 24 24"
                fill="currentColor"
              >
                <path
                  d="M512.5 54C765.723 54 971 259.277 971 512.5S765.723 971 512.5 971 54 765.723 54 512.5 259.277 54 512.5 54z m0 64C294.624 118 118 294.624 118 512.5S294.624 907 512.5 907 907 730.376 907 512.5 730.376 118 512.5 118z m0 149.25c17.496 0 31.713 14.042 31.996 31.47l0.004 0.53v426.5c0 17.673-14.327 32-32 32-17.496 0-31.713-14.042-31.996-31.47l-0.004-0.53v-426.5c0-17.673 14.327-32 32-32z m127.95 85.3c17.496 0 31.713 14.042 31.996 31.47l0.004 0.53v255.9c0 17.673-14.327 32-32 32-17.496 0-31.713-14.042-31.996-31.47l-0.004-0.53v-255.9c0-17.673 14.327-32 32-32z m-255.9 0c17.496 0 31.713 14.042 31.996 31.47l0.004 0.53v255.9c0 17.673-14.327 32-32 32-17.496 0-31.713-14.042-31.996-31.47l-0.004-0.53v-255.9c0-17.673 14.327-32 32-32z m383.85 85.3c17.496 0 31.713 14.042 31.996 31.47l0.004 0.53v85.3c0 17.673-14.327 32-32 32-17.496 0-31.713-14.042-31.996-31.47l-0.004-0.53v-85.3c0-17.673 14.327-32 32-32z m-511.8 0c17.496 0 31.713 14.042 31.996 31.47l0.004 0.53v85.3c0 17.673-14.327 32-32 32-17.496 0-31.713-14.042-31.996-31.47l-0.004-0.53v-85.3c0-17.673 14.327-32 32-32z"
                  p-id="12589"
                ></path>
              </svg>
            </button>
            <div class="row"><div id="kana">いた</div></div>
            <div class="row"><div id="chinese">木板</div></div>
            <div class="row"><div id="english">board</div></div>
            <div class="row" id="romaji-container">
              <div id="romaji">ita</div>
            </div>
          </div>
          <button
            type="button"
            id="nextButton"
            class="nav-button right"
            aria-label="next"
          ></button>
        </div>
        <div class="training">
          <input
            type="text"
            id="input"
            placeholder="敲敲看"
            autocomplete="off"
          />
          <button type="button" id="checkButton">检查</button>
        </div>

        <!-- <div class="jlpt">
        <div>距离 JLPT 考试时间</div>
        <div id="countdown" class="countdown-display">计算中...</div>
      </div> -->

        <a href="/database.html">词库</a>
      </div>
    </div>

    <div id="tab2" class="tab-content">
      <div class="handwriting-box">
        <div class="canvas-controls">
          <p class="canvas-label">书写试试！！！</p>
          <button id="clearCanvas">清除</button>
        </div>
        <canvas id="handwritingCanvas"></canvas>
      </div>
    </div>

    <div id="tab3" class="tab-content">
      <div class="link-box">
        <h3>推荐链接</h3>
        <div class="link-list">
          <a
            href="https://res.wokanxing.info/jpgramma/index.html"
            class="link-item active"
            data-url="https://res.wokanxing.info/jpgramma/index.html"
            href="javascript:void(0);"
          >
            日语语法指南
          </a>
          <a
            href="javascript:void(0);"
            class="link-item"
            data-url="https://www3.nhk.or.jp/news/easy/"
          >
            NHK 日语学习
          </a>
          <a
            href="javascript:void(0);"
            class="link-item"
            data-url="https://www.tanos.co.uk/jlpt/"
          >
            Tanos JLPT 词汇表
          </a>
          <a
            href="javascript:void(0);"
            class="link-item"
            data-url="https://imabi.org/"
          >
            IMABI 今日
          </a>
          <a
            href="javascript:void(0);"
            class="link-item"
            data-url="https://takoboto.jp/bunpo/"
          >
            TAKOBOTO
          </a>
          <a
            href="javascript:void(0);"
            class="link-item"
            data-url="https://www.aozora.gr.jp/"
          >
            青空文库
          </a>
        </div>
      </div>

      <!-- iframe区域，默认加载第一个链接 -->
      <div
        class="iframe-container"
        style="margin-top: 20px; height: 600px; border: 1px solid #ccc"
      >
        <iframe
          id="contentFrame"
          src="https://res.wokanxing.info/jpgramma/index.html"
          style="width: 100%; height: 100%; border: none"
        ></iframe>
      </div>
    </div>

    <div id="tab4" class="tab-content">
      <div class="usage">
        <h2>词卡快捷键</h2>
        <table>
          <thead>
            <tr>
              <th>快捷键</th>
              <th>功能说明</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>空格键 (Space)</td>
              <td>发音当前单词</td>
            </tr>
            <tr>
              <td>Alt + I</td>
              <td>聚焦输入框</td>
            </tr>
            <tr>
              <td>Alt + J</td>
              <td>跳转到词库页面</td>
            </tr>
            <tr>
              <td>左箭头 (←)</td>
              <td>切换到上一个单词</td>
            </tr>
            <tr>
              <td>右箭头 (→)</td>
              <td>切换到下一个单词</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </body>
</html>
